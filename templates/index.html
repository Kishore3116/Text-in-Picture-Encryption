<!DOCTYPE html>
<html>
<head>
    <title>Text in Picture Encryption</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f9;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            font-size: 24px;
        }
        .container {
            margin: 50px auto;
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.2);
        }
        h2 {
            color: #2c3e50;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
            text-align: left;
        }
        input[type="file"], input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background: #3498db;
            color: white;
            padding: 12px 20px;
            border: none;
            margin-top: 10px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background: #2980b9;
        }
        footer {
            margin-top: 50px;
            padding: 10px;
            background: #2c3e50;
            color: white;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header>
        Text in Picture Encryption
    </header>

    <div class="container">
        <h2>Encrypt Text into Image</h2>
        <form action="/encrypt" method="post" enctype="multipart/form-data">
            <label>Select Image:</label>
            <input type="file" name="image" required>
            <label>Enter Secret Message:</label>
            <input type="text" name="message" placeholder="Enter your text..." required>
            <button type="submit">Encrypt</button>
        </form>
    </div>

    <div class="container">
        <h2>Decrypt Text from Image</h2>
        <form action="/decrypt" method="post" enctype="multipart/form-data">
            <label>Select Stego Image:</label>
            <input type="file" name="image" required>
            <button type="submit">Decrypt</button>
        </form>
    </div>

    <footer>
        Made with ❤️ during Internship | Kishore S
    </footer>
</body>
</html>
